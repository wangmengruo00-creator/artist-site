<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mengruo Wang</title>
    <meta
      name="description"
      content="Mengruo Wang, artist and practice-based researcher."
    >
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
  </head>
  <body class="landing-page">
    <header class="landing-header" aria-label="Primary navigation">
      <a class="landing-brand" href="index.html" aria-current="page">Mengruo Wang</a>
      <nav class="landing-nav">
        <a href="works.html">Works</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main class="landing-main">
      <div class="landing-light" aria-hidden="true"></div>
      <section class="landing-copy" aria-labelledby="home-title">
        <h1 id="home-title">MENGRUO WANG</h1>
        <p class="landing-role">Practice-based artist and researcher</p>
        <p class="landing-statement">
          Working across printed matter, material traces, embodied writing, and
          responsive systems of reading.
        </p>
        <a class="landing-enter" href="works.html">Enter selected works <span aria-hidden="true">→</span></a>
      </section>
      <footer class="landing-footer">
        <span>Shenzhen / Hong Kong</span>
        <span>Selected practice · 2016—2026</span>
      </footer>
    </main>
    <script>
      const root = document.documentElement;

      if (window.matchMedia("(pointer: fine)").matches) {
        window.addEventListener(
          "pointermove",
          (event) => {
            const x = event.clientX / window.innerWidth;
            const y = event.clientY / window.innerHeight;

            root.style.setProperty("--mx", x.toFixed(3));
            root.style.setProperty("--my", y.toFixed(3));
            root.style.setProperty("--copy-x", `${((x - 0.5) * 3).toFixed(2)}px`);
            root.style.setProperty("--copy-y", `${((y - 0.5) * 2).toFixed(2)}px`);
          },
          { passive: true }
        );
      }
    </script>
    <script src="language.js"></script>
  </body>
</html>

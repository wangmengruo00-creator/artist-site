<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mengruo Wang</title>
    <meta
      name="description"
      content="Mengruo Wang, artist and practice-based researcher."
    >
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
  </head>
  <body class="landing-page">
    <header class="landing-header" aria-label="Primary navigation">
      <a class="landing-brand" href="index.html" aria-current="page">Mengruo Wang</a>
      <nav class="landing-nav">
        <a href="works.html">Works</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main class="landing-main">
      <div class="landing-light" aria-hidden="true"></div>
      <section class="landing-copy" aria-labelledby="home-title">
        <h1 id="home-title">MENGRUO WANG</h1>
        <p>Artist &amp; practice-based researcher</p>
      </section>
    </main>
    <script>
      const root = document.documentElement;

      window.addEventListener(
        "pointermove",
        (event) => {
          root.style.setProperty("--mx", (event.clientX / window.innerWidth).toFixed(3));
          root.style.setProperty("--my", (event.clientY / window.innerHeight).toFixed(3));
        },
        { passive: true }
      );
    </script>
  </body>
